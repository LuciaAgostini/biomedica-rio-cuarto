{% extends "base.html" %}
{% block content %}
<h1 class="h4 mb-3">{% if object %}Editar producto{% else %}Nuevo producto{% endif %}</h1>
<form method="post" class="card card-body" style="max-width:640px">
  {% csrf_token %}{{ form.as_p }}
  <div><button class="btn btn-primary">Guardar cambios</button>
  <a class="btn btn-link" href="{% url 'catalog:producto_list' %}">Cancelar</a></div>
</form>
{% endblock %}
